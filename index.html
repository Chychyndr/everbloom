<script>
"use strict";
const canvas=document.querySelector("canvas"),ctx=canvas.getContext("2d",{alpha:false});
const TAU=Math.PI*2, golden=2.399963, clamp=x=>Math.max(0,Math.min(1,x)), ease=x=>{x=clamp(x);return x*x*(3-2*x)};

const green=[119,220,121];
const presets=[
 ["Rose",[242,47,92],7,6,1.0,.95,.95],
 ["Lotus",[222,112,255],9,4,1.45,.63,1.3],
 ["Sunflower",[255,194,46],23,2,1.13,.36,.18],
 ["Sakura",[255,174,211],5,1,1.05,.85,.35],
 ["Lavender",[173,118,255],5,2,.85,.7,.4],
 ["Orchid",[234,123,247],5,1,1.35,1.1,.6],
 ["Tulip",[255,100,115],6,2,1.05,.87,1.8],

const seed=Math.random()*1000;
let points=[],current=0,begin=performance.now(),size=1,px=0,py=0,tx=0,ty=0,raf=0;
const motion=matchMedia("(prefers-reduced-motion: reduce)");
function add(x,y,z,c,l=1,birth=0){const i=points.length;points.push({x,y,z,c,l,birth,r:rand(i+seed),a:rand(i+13)*TAU,v:rand(i+78)});}
function tube(ax,ay,az,bx,by,bz,c,radius=2,count=180,bend=0,twist=0,taper=.5){

}
function leaf(x,y,z,side,len,angle,shape=.26,color=green,arch=0){

}
// Each profile defines stem height, curvature, thickness and leaf geometry.
const stems={
 Lotus:{x:0,y:42,bend:31,twist:-13,r:3.5,c:[102,189,134],leaves:[[.15,-1,83,.16,.48],[.18,1,63,.25,.45]]},
 Sakura:{x:108,y:142,bend:-28,twist:12,r:7,c:[153,104,86],leaves:[[.44,-1,35,.8,.24],[.65,1,28,.6,.22]]},
 Lavender:{x:0,y:164,bend:7,twist:5,r:1.8,c:[122,177,116],leaves:[[.18,-1,39,.93,.075],[.18,1,35,.86,.075],[.34,-1,32,.91,.075],[.49,1,29,.88,.075]]},
 Rose:{x:-20,y:102,bend:30,twist:-10,r:4.5,c:[82,161,76],leaves:[[.27,-1,77,.66,.32],[.46,1,68,.62,.30],[.65,-1,47,.62,.28]]},
 Sunflower:{x:7,y:136,bend:-7,twist:2,r:8,c:[122,190,74],leaves:[[.22,-1,101,.43,.37],[.44,1,108,.49,.38],[.61,-1,68,.65,.33]]},
 Orchid:{x:47,y:119,bend:-39,twist:6,r:2.7,c:[91,167,100],leaves:[[.06,-1,132,.54,.24,20],[.12,1,114,.43,.25,24]]},
 Tulip:{x:-17,y:108,bend:16,twist:0,r:5,c:[105,194,104],leaves:[[.12,-1,158,1.12,.13,12],[.28,1,133,1.01,.14,16]]},
 Daisy:{x:25,y:91,bend:-19,twist:12,r:1.7,c:[123,184,91],leaves:[[.13,-1,65,.45,.15],[.21,1,56,.55,.14],[.33,-1,39,.58,.14]]},
 "Blue poppy":{x:-39,y:122,bend:32,twist:20,r:2.8,c:[85,158,110],leaves:[[.32,1,79,.45,.25],[.53,-1,66,.62,.22],[.72,1,38,.68,.19]]}
};
function individualStem(name,x,y,z,baseX=0,baseY=-210,baseZ=0,k=1){
 const p=stems[name]||stems.Daisy;
 const path=tube(baseX,baseY,baseZ,x,y,z,p.c,p.r*k,Math.max(120,Math.round(330*k)),p.bend*k,p.twist*k,.55);
 for(const [u,side,len,angle,shape,arch=0] of p.leaves){
  const [lx,ly,lz]=path(u);
  leaf(lx,ly,lz,side,len*k,angle,shape,p.c,arch*k);
 }
 if(name==="Rose"){
  for(const [u,side] of [[.19,1],[.38,-1],[.57,1],[.76,-1]]){
   const [lx,ly,lz]=path(u);
   for(let j=0;j<18;j++){const t=j/17;add(lx+side*t*9*k,ly+t*7*k,lz,p.c,.7,.7+u*.25);}
  }
 }
 return path;
}
function head(x,y,z,r,p,birth=1){
 const [name,color,n,layers,length,wide,cup]=p;

 const scale=1-layer*.105, count=n+(name==="Rose"?layer:0);
 for(let pet=0;pet<count;pet++){
 const a=TAU*pet/count+layer*.59;
 for(let i=0;i<Math.max(42,Math.floor(205/count*8/layers));i++){
 const u=rand(i+pet*311+layer*97),v=rand(i+pet*71+layer*413)*2-1;

 const w=r*wide*scale*Math.pow(Math.sin(Math.PI*u),.67)*.43;
 const tangent=v*w;
 const rise=r*(cup*(u*u*.36+layer*.11)+.13*Math.sin(u*Math.PI)-.11*v*v);
 const localX=rr*Math.cos(a)-tangent*Math.sin(a);

 const shade=.57+.53*u+.19*Math.cos(a+1.4)-.23*Math.abs(v);

 }
 }
 }
 if(name==="Rose"||name==="Tulip")return;

}
function build(index){

 if(name==="Sakura"){
  const wood=[153,104,86];
  const trunk=tube(-158,-185,-7,108,142,0,wood,7,360,-28,12,.82);
  for(let j=0;j<7;j++){
   const u=.16+j*.119,[x,y,z]=trunk(u),side=j%2?1:-1;
   const hx=x+side*(40+18*rand(j)),hy=y+30+15*rand(j+5);
   tube(x,y,z,hx,hy,12,wood,2.8,100,side*9,-side*5,.75);
   head(hx,hy,12,34,p,.6+j*.22);
  }
 }else if(name==="Lavender"){
  for(let j=0;j<5;j++){
   const x=(j-2)*53,h=164-22*Math.abs(j-2),c=[122,177,116];
   const path=tube(x*.22,-205,-5,x,h,0,c,1.8,210,(j-2)*7,5*(j%2?1:-1),.45);
   for(const u of [.18,.34,.49]){
    const [lx,ly,lz]=path(u);
    leaf(lx,ly,lz,-1,39,.93,.075,c);
    leaf(lx,ly,lz,1,35,.86,.075,c);
   }
   for(let k=0;k<7;k++){
    const u=1-k*.06,[lx,ly,lz]=path(u);
    head(lx+(k%2?8:-8),ly,lz+5,12+(k%3)*2,p,.7+k*.13);
   }
  }
 }else if(name==="Bouquet"){
  for(let j=0;j<9;j++){
   const a=j*golden,x=Math.cos(a)*(j?110:0),z=Math.sin(a)*70,y=106+40*Math.sin(j*2),species=presets[j];
   individualStem(species[0],x,y,z,x*.12,-110,0,.51);
   head(x,y,z,43,species,.4+j*.24);
  }
  for(let i=0;i<1100;i++){const u=rand(i),a=rand(i+5)*TAU,r=30+34*Math.sin(Math.PI*u);add(Math.cos(a)*r,-110-u*118,Math.sin(a)*r,[109,132,219],.5+.5*Math.cos(a),1+u);}
 }else if(name==="Lotus"){
  for(let i=0;i<1150;i++){
   const a=rand(i)*TAU,u=Math.sqrt(rand(i+3));if(a>.12&&a<.50)continue;
   add(Math.cos(a)*u*145,-108+Math.sin(a)*u*30,Math.sin(a)*u*60,[83,169,118],.5+.5*u,.5);
  }
  tube(-27,-110,-4,0,42,0,[102,189,134],3.5,230,34,-13,.27);
  head(0,42,0,108,p,.6);
 }else{
  const q=stems[name],r=name==="Sunflower"?117:96;

}
const alphabet={
 A:[14,17,17,31,17,17,17],B:[30,17,17,30,17,17,30],C:[14,17,16,16,16,17,14],
 D:[30,17,17,17,17,17,30],E:[31,16,16,30,16,16,31],F:[31,16,16,30,16,16,16],
 H:[17,17,17,31,17,17,17],I:[31,4,4,4,4,4,31],K:[17,18,20,24,20,18,17],
 L:[16,16,16,16,16,16,31],N:[17,25,21,19,17,17,17],O:[14,17,17,17,17,17,14],
 P:[30,17,17,30,16,16,16],Q:[14,17,17,17,21,18,13],R:[30,17,17,30,20,18,17],
 S:[15,16,16,14,1,1,30],T:[31,4,4,4,4,4,4],U:[17,17,17,17,17,17,14],
 V:[17,17,17,17,17,10,4],W:[17,17,17,21,21,21,10],Y:[17,17,10,4,4,4,4]
};
function titlePoints(name){
 const chars=name.toUpperCase().split(""),out=[];
 let cursor=0;
 for(const char of chars){
  if(char===" "){cursor+=3;continue;}
  const rows=alphabet[char];if(!rows)throw Error("Unsupported title character: "+char);
  rows.forEach((row,y)=>{for(let x=0;x<5;x++)if(row&(1<<(4-x)))out.push([cursor+x,y]);});
  cursor+=6;
 }

}
const titles=presets.map(p=>titlePoints(p[0]));
function drawTitle(ctx,size,current,age,exit,compact=false){
 const {out,width}=titles[current],color=presets[current][1];
 const cell=Math.min(size*(compact?.013:.0105),size*.80/width,8.5);
 const left=(size-(width-1)*cell)/2,top=size*.085;
 const g=motion.matches?1:ease((age-.15)/1.5)*(1-exit);

 for(let i=0;i<out.length;i++){
  const [x,y]=out[i],a=g*(.77+.23*rand(i+11));
  ctx.fillStyle="rgba("+color.map(c=>Math.round(c*.62+97)).join(",")+","+a+")";
  ctx.fillText(i%7===0?"*":"#",left+x*cell,top+y*cell);
 }
}
let sceneHeight=1;
const portrait=matchMedia("(max-width:720px) and (orientation:portrait)");
const boundsCache=new WeakMap();
function sceneBounds(points){
 if(boundsCache.has(points))return boundsCache.get(points);
 let left=Infinity,right=-Infinity,top=-Infinity,bottom=Infinity;
 // Reserve enough space for the full rotation and pointer parallax range.
 for(let a=-.7;a<=.71;a+=.175){
  const c=Math.cos(a),s=Math.sin(a);
  for(const p of points){
   const x=p.x*c-p.z*s,z=p.x*s+p.z*c,k=620/(620-z);
   const y=p.y*k,drift=Math.abs(z*.14*k);
   left=Math.min(left,x*k);right=Math.max(right,x*k);
   bottom=Math.min(bottom,y-drift);top=Math.max(top,y+drift);
  }
 }
 const bounds={left,right,top,bottom};boundsCache.set(points,bounds);return bounds;
}
function layoutScene(points,width,height,compact,preview){
 if(!compact)return {scale:width/745,x:width/2,y:height*.57,top:width*.19};
 const b=sceneBounds(points),top=width*.22,bottom=height-width*.055;
 const scale=Math.min(width/745*(preview?1.35:1.7),width*.85/Math.max(1,b.right-b.left),(bottom-top)*.91/Math.max(1,b.top-b.bottom));
 return {scale,x:width/2-(b.left+b.right)*scale/2,y:(top+bottom)/2+(b.top+b.bottom)*scale/2,top};
}
function resize(){const rect=canvas.getBoundingClientRect(),dpr=Math.min(2,devicePixelRatio||1);size=Math.max(1,rect.width);sceneHeight=Math.max(1,rect.height);canvas.width=Math.round(size*dpr);canvas.height=Math.round(sceneHeight*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);}
function renderScene(ctx,size,current,points,age,px=0,py=0,hold=false,preview=false,height=size){
 const angle=motion.matches?.22:Math.sin(age*.37)*.42+px*.28,cos=Math.cos(angle),sin=Math.sin(angle);
 const compact=portrait.matches;
 const layout=layoutScene(points,size,height,compact,preview),scale=layout.scale, exit=motion.matches||hold?0:ease((age-20)/4);

 const glyphSize=Math.max(2.5,Math.min(9,scale*745/93));
 ctx.font="bold "+glyphSize+"px ui-monospace,Consolas,monospace";ctx.textAlign="center";ctx.textBaseline="middle";
 const cells=new Map(),step=glyphSize*.73,vertical=glyphSize*1.14;
 for(const p of points){
 const g=ease((age-p.birth)/2.1);if(g<=0)continue;

 const scatter=exit+(current===0&&age<4?0:(1-g)*.65);
 const x=p.x*g+sway+Math.cos(p.a)*scatter*(60+p.v*220),y=p.y*g+Math.sin(p.a)*scatter*(60+p.v*220),z=p.z*g+exit*p.r*100;

 }
 for(const {p,z,x,y,g} of cells.values()){
 const light=Math.max(.55,Math.min(1.55,p.l*(1.32+z/520)));
 const alpha=g*(1-exit*.98);

 const char=glyphs[Math.min(glyphs.length-1,Math.floor(light*6+p.r*3))];

 }
 if(!motion.matches){
 for(let i=0;i<35;i++){
 const u=(age*.075+rand(i+200))%1,a=i*golden;

 }
 }
 drawTitle(ctx,size,current,preview?9:age,preview?0:exit,compact);
}
const stage=document.getElementById("stage"),gallery=document.getElementById("gallery"),galleryButton=document.getElementById("galleryButton"),closeGallery=document.getElementById("closeGallery"),cards=document.getElementById("cards");
let view="stage",selected=false,finished=false,galleryUnlocked=false,openedAt=0,pausedAt=0,lastPreview=-Infinity;
const previews=[];
function select(index,now=performance.now()){
 current=index;begin=now;build(current);canvas.setAttribute("aria-label",presets[current][0]);
}
function next(now=performance.now()){
 if(selected){select(current,now);return;}
 if(current===presets.length-1){finished=true;galleryButton.hidden=false;return;}
 select(current+1,now);
}
function paint(now){
 let age=Math.max(0,(now-begin)/1000);
 if(!motion.matches&&age>=24&&!finished){next(now);age=Math.max(0,(now-begin)/1000);}
 if(motion.matches)age=9;

 const hold=!selected&&current===presets.length-1;
 renderScene(ctx,size,current,points,age,px,py,hold,false,sceneHeight);
}
function createCards(){
 const saved=points;
 presets.forEach(([name,color],index)=>{
  build(index);const data=points;
  const button=document.createElement("button");button.type="button";button.className="flower-card";button.setAttribute("aria-label",name);button.style.setProperty("--accent","rgb("+color.join(",")+")");
  const preview=document.createElement("canvas");preview.setAttribute("aria-hidden","true");button.append(preview);cards.append(button);
  previews.push({button,canvas:preview,ctx:preview.getContext("2d",{alpha:false}),points:data,index,size:0});
  button.addEventListener("click",()=>{selected=true;finished=false;select(index);showStage();galleryButton.hidden=false;galleryButton.focus({preventScroll:true});});
 });
 points=saved;
}
function resizeCards(){
 const dpr=Math.min(1.5,devicePixelRatio||1);
 for(const p of previews){const w=p.canvas.getBoundingClientRect().width;if(w<=0)continue;p.size=w;p.canvas.width=Math.round(w*dpr);p.canvas.height=Math.round(w*dpr);p.ctx.setTransform(dpr,0,0,dpr,0,0);}
}
function paintCards(now){
 if(now-lastPreview<50&&!motion.matches)return;lastPreview=now;
 for(const p of previews){
  const rect=p.canvas.getBoundingClientRect();if(!p.size||rect.bottom<0||rect.top>innerHeight)continue;
  const age=motion.matches?9:((now-openedAt)/1000+5+p.index*.7)%24;
  renderScene(p.ctx,p.size,p.index,p.points,age,0,0,false,true);
 }
}
function openGallery(){
 if(view==="gallery")return;galleryUnlocked=true;pausedAt=performance.now();view="gallery";stage.hidden=true;gallery.hidden=false;
 if(!previews.length)createCards();openedAt=performance.now();lastPreview=-Infinity;resizeCards();gallery.scrollTop=0;restart();closeGallery.focus({preventScroll:true});
}
function replay(){
 selected=false;finished=false;galleryUnlocked=true;px=py=tx=ty=0;select(0);
 galleryButton.hidden=false;showStage();canvas.focus({preventScroll:true});
}
function showStage(resume=false){
 if(resume)begin+=performance.now()-pausedAt;
 view="stage";gallery.hidden=true;stage.hidden=false;restart();
}
function frame(now){
 if(view==="gallery")paintCards(now);else paint(now);
 if(!motion.matches&&!document.hidden)raf=requestAnimationFrame(frame);
}
function restart(){cancelAnimationFrame(raf);if(view==="gallery"){resizeCards();lastPreview=-Infinity;}else resize();frame(performance.now());}
canvas.addEventListener("pointermove",e=>{const r=canvas.getBoundingClientRect();tx=(e.clientX-r.left)/r.width*2-1;ty=(e.clientY-r.top)/r.height*2-1;});
canvas.addEventListener("pointerleave",()=>{tx=ty=0;});
canvas.addEventListener("click",()=>{next();if(motion.matches)paint(performance.now());});
galleryButton.addEventListener("click",openGallery);
document.getElementById("replayGallery").addEventListener("click",replay);
closeGallery.addEventListener("click",()=>{showStage(true);galleryButton.focus({preventScroll:true});});
window.addEventListener("keydown",e=>{if(e.key==="Escape"){if(view==="gallery"){showStage(true);galleryButton.focus({preventScroll:true});}else if(selected)openGallery();}});
gallery.addEventListener("scroll",()=>{if(motion.matches)paintCards(performance.now());},{passive:true});
window.addEventListener("resize",restart);motion.addEventListener("change",()=>{galleryButton.hidden=!(galleryUnlocked||finished||selected||motion.matches);restart();});
document.addEventListener("visibilitychange",()=>{cancelAnimationFrame(raf);if(!document.hidden)restart();});
select(0);if(motion.matches)galleryButton.hidden=false;restart();
</script></body></html>
